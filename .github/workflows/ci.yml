# Every check from AGENTS.md, on every pull request and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR replaces its run; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Smoke tests run against the dev server (see playwright.config.ts).
      # The headless shell is all the smoke tests need (as in AGENTS.md).
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      # The service worker exists only in the build above: offline and manifest.
      - run: npm run test:pwa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
